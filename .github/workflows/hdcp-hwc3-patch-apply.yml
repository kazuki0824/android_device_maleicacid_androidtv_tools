name: Android 15 HWC3 HDCP patch applicability

on:
  push:
    branches:
      - experiment/r86s-widevine-hdcp-validation-over-pr15
    paths:
      - .github/workflows/hdcp-hwc3-patch-apply.yml
      - patches/lineage-22.1/drm_hwcomposer_i915_hdcp_desired.patch
      - patches/lineage-22.1/drm_hwcomposer_actual_composition_change_count.patch
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Clone the audited Android 15 drm_hwcomposer tag
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch android-15.0.0_r14 \
            https://github.com/aosp-mirror-neo/platform_external_drm_hwcomposer.git \
            "$RUNNER_TEMP/drm_hwcomposer"
          git -C "$RUNNER_TEMP/drm_hwcomposer" rev-parse HEAD
      - name: Fetch the exact product PR #15 HDCP patch (no rebase)
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 \
            "https://raw.githubusercontent.com/kazuki0824/android_device_maleicacid_androidtv_tools/8797693a798f091e18ff9f71efae856e3307945d/patches/lineage-22.1/drm_hwcomposer_i915_hdcp_desired.patch" \
            -o "$RUNNER_TEMP/product-i915-hdcp.patch"
          test -s "$RUNNER_TEMP/product-i915-hdcp.patch"
          echo 'Audited tools PR #15 HEAD: 8797693a798f091e18ff9f71efae856e3307945d' >> "$GITHUB_STEP_SUMMARY"
      - name: Simulate 60/120 Hz KMS enumeration bounds (not runtime latency)
        shell: bash
        run: |
          python3 - <<'PY'
          for hz in (60, 120):
              next_poll = 0
              query_count = 0
              for frame in range(hz * 3):
                  now = int(frame * 1000 / hz)
                  if now >= next_poll:
                      query_count += 1
                      next_poll = now + 250
              assert query_count <= 13, (hz, query_count)
              print(f"PASS: {hz} Hz / 3 s: {query_count} KMS enumeration calls vs {hz * 3} without throttle")
          # Connector changes reset poll timer: this is a state model,
          # not measured HWC3 CPU time, actual i915 ioctl count or HDCP latency.
          print("NOT PROVEN: actual frame latency, ioctl timing or HDCP link behavior")
          PY
      - name: Verify actual patch application in production order
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/drm_hwcomposer"
          for patch in \
            patches/lineage-22.1/drm_hwcomposer_actual_composition_change_count.patch \
            "$RUNNER_TEMP/product-i915-hdcp.patch"; do
            echo "Validating: $patch"
            if [[ "$patch" == /* ]]; then target="$patch"; else target="$GITHUB_WORKSPACE/$patch"; fi
            git -C "$src" apply --check "$target"
            git -C "$src" apply "$target"
          done
          git -C "$src" diff --check
          python3 - "$src" <<'PY'
          import pathlib
          import sys
          root = pathlib.Path(sys.argv[1])
          h = (root / "drm/DrmAtomicStateManager.h").read_text()
          cpp = (root / "drm/DrmAtomicStateManager.cpp").read_text()
          assert "hdcp_request_attempted_" not in h
          assert "last_hdcp_status_" in h
          assert "next_hdcp_poll_" in h
          assert "#include <chrono>" in h
          assert "std::chrono::milliseconds(250)" in cpp
          assert "drmModeAtomicDuplicate(pset.get())" in cpp
          assert "hdcp_in_commit" in cpp
          assert "unprotected_pset.get()" in cpp
          assert "HDCP Enabled" in cpp
          assert "drmModeAtomicCommit(*drm->GetFd(), hdcp_pset" not in cpp
          assert '"Content Protection"' in cpp and '"Desired"' in cpp
          assert '"ro.product.device"' in cpp and '"r86s_virtio_tv"' in cpp
          assert "drmModeAtomicCommit" in cpp
          assert cpp.count('drm->GetProperty(connector->GetId(), DRM_MODE_OBJECT_CONNECTOR') == 1
          assert cpp.index("if (now >= next_hdcp_poll_)") < cpp.index("drm->GetProperty(connector->GetId(), DRM_MODE_OBJECT_CONNECTOR")
          print("PASS: both product patches applied cleanly to AOSP A15 r14 sources")
          print("NOT PROVEN: A15 compilation, KMS property exposure, physical HDCP authentication")
          PY
